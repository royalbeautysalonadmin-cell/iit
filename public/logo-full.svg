<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <filter id="textShadow" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Icon mark with shadow -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <!-- Bottom grey curved lines -->
    <path d="M42,88 Q16,76 20,52 Q24,32 46,24" fill="none" stroke="#B8C0C8" stroke-width="7" stroke-linecap="round"/>
    <path d="M38,94 Q8,80 14,48 Q20,22 48,14" fill="none" stroke="#C8CDD2" stroke-width="7" stroke-linecap="round"/>
    <path d="M34,100 Q2,84 10,44 Q18,16 50,8" fill="none" stroke="#D4D8DC" stroke-width="7" stroke-linecap="round"/>

    <!-- Blue curved lines -->
    <path d="M46,82 Q24,72 26,52 Q28,36 46,28" fill="none" stroke="#5CB8E8" stroke-width="7" stroke-linecap="round"/>
    <path d="M50,76 Q32,68 32,52 Q32,38 48,30" fill="none" stroke="#3AA0D8" stroke-width="7" stroke-linecap="round"/>
    <path d="M54,70 Q40,64 38,50 Q36,38 50,32" fill="none" stroke="#2D8FD1" stroke-width="7" stroke-linecap="round"/>

    <!-- Blue diagonal accents -->
    <line x1="40" y1="10" x2="58" y2="28" stroke="#2D8FD1" stroke-width="7" stroke-linecap="round"/>
    <line x1="50" y1="6" x2="64" y2="20" stroke="#2D8FD1" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

    <!-- Blue dot -->
    <circle cx="68" cy="4" r="5.5" fill="#2D8FD1"/>
  </g>

  <!-- INNOVATIVE text with shadow effect -->
  <g filter="url(#textShadow)">
    <text x="130" y="62" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="800" font-size="44" fill="#1C2B3A" letter-spacing="-0.5">i</text>
    <text x="148" y="62" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="800" font-size="44" fill="#2A3540" letter-spacing="-0.5">NNOVATIVE</text>
  </g>

  <!-- TECHNOLOGY text -->
  <text x="130" y="104" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="800" font-size="44" fill="#2D8FD1" letter-spacing="-0.5">TECHNOLOGY</text>
</svg>
