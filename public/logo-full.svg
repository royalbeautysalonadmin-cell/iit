<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100">
  <!-- Icon mark -->
  <defs>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <g filter="url(#iconShadow)">
    <!-- Grey curved lines -->
    <path d="M38,82 Q18,72 22,52 Q26,34 44,28" fill="none" stroke="#B0BAC4" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M34,88 Q10,76 16,48 Q22,24 46,16" fill="none" stroke="#C7CDD3" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Blue curved lines -->
    <path d="M42,76 Q26,68 28,52 Q30,38 44,32" fill="none" stroke="#4AABDE" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M46,70 Q34,64 34,50 Q34,38 46,32" fill="none" stroke="#2D8FD1" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Blue diagonal accent -->
    <line x1="38" y1="14" x2="54" y2="30" stroke="#2D8FD1" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Blue dot -->
    <circle cx="58" cy="10" r="4.5" fill="#2D8FD1"/>
  </g>

  <!-- Text: INNOVATIVE -->
  <text x="115" y="48" font-family="Poppins, Arial, sans-serif" font-weight="800" font-size="38" fill="#1C2B3A" letter-spacing="-0.5">INNOVATIVE</text>
  <!-- Blue dot over the I -->
  <circle cx="121" cy="22" r="5" fill="#2D8FD1"/>

  <!-- Text: TECHNOLOGY -->
  <text x="115" y="86" font-family="Poppins, Arial, sans-serif" font-weight="800" font-size="38" fill="#2D8FD1" letter-spacing="-0.5">TECHNOLOGY</text>
</svg>
