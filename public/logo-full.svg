<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 110">
  <defs>
    <filter id="ds" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Icon mark -->
  <g transform="translate(5,8)" filter="url(#ds)">
    <!-- Grey curves (bottom layer) -->
    <path d="M36,78 Q14,68 18,48 Q22,30 42,22" fill="none" stroke="#B0B8C0" stroke-width="6" stroke-linecap="round"/>
    <path d="M32,84 Q6,72 12,44 Q18,20 44,12" fill="none" stroke="#C0C8D0" stroke-width="6" stroke-linecap="round"/>
    <path d="M28,90 Q0,76 8,40 Q16,14 46,6" fill="none" stroke="#D0D4D8" stroke-width="6" stroke-linecap="round"/>
    <!-- Blue curves (top layer) -->
    <path d="M40,72 Q22,64 24,48 Q26,34 42,26" fill="none" stroke="#5CB8E8" stroke-width="6" stroke-linecap="round"/>
    <path d="M44,66 Q30,60 30,46 Q30,34 44,28" fill="none" stroke="#3AA0D8" stroke-width="6" stroke-linecap="round"/>
    <path d="M48,60 Q36,56 34,44 Q32,34 46,28" fill="none" stroke="#2D8FD1" stroke-width="6" stroke-linecap="round"/>
    <!-- Blue diagonal strokes -->
    <line x1="34" y1="8" x2="50" y2="24" stroke="#2D8FD1" stroke-width="6" stroke-linecap="round"/>
    <line x1="44" y1="4" x2="56" y2="16" stroke="#2D8FD1" stroke-width="4.5" stroke-linecap="round" opacity="0.65"/>
    <!-- Blue dot -->
    <circle cx="60" cy="2" r="5" fill="#2D8FD1"/>
  </g>

  <!-- INNOVATIVE -->
  <text x="118" y="58" font-family="Poppins, Arial Black, sans-serif" font-weight="800" font-size="42" fill="#1C2B3A" letter-spacing="0.5">iNNOVATIVE</text>

  <!-- TECHNOLOGY -->
  <text x="118" y="100" font-family="Poppins, Arial Black, sans-serif" font-weight="800" font-size="42" fill="#2D8FD1" letter-spacing="0.5">TECHNOLOGY</text>
</svg>
